name: PatataTube
options:
  bundleIdPrefix: com.patatatube
  deploymentTarget:
    iOS: "17.0"
# Project-level build settings. These reach the SwiftPM package targets
# (PatataTubeKit) as well as the app target, which a target-level setting would
# not — and most of the instrumented code lives in the package.
#
# DEVLOG turns on DevLog (see PatataTubeKit/Sources/PatataTubeKit/DevLog.swift).
# Debug only, so a plain Xcode Run in the Simulator is always instrumented while
# a normal Release archive stays silent. Instrumented *Release* .ipas come from
# `./deploy --instrumented`, which injects the same condition on the xcodebuild
# command line.
settings:
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEVLOG"

packages:
  PatataTubeKit:
    path: ../PatataTubeKit
  Capture:
    url: https://github.com/bitdriftlabs/capture-ios.git
    from: "0.23.5"
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "8.58.4"
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks.git
    from: "1.1.0"
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: "0.10.3"
targets:
  PatataTube:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.patatatube.openWeb
            UIApplicationShortcutItemTitle: Open Web
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeBookmark
          - UIApplicationShortcutItemType: com.patatatube.clearVideos
            UIApplicationShortcutItemTitle: Clear Videos
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
          - UIApplicationShortcutItemType: com.patatatube.clearCovers
            UIApplicationShortcutItemTitle: Clear Covers
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
          - UIApplicationShortcutItemType: com.patatatube.clearLists
            UIApplicationShortcutItemTitle: Clear Lists
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
          - UIApplicationShortcutItemType: com.patatatube.resetSettings
            UIApplicationShortcutItemTitle: Reset Settings
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
          - UIApplicationShortcutItemType: com.patatatube.clearRestoration
            UIApplicationShortcutItemTitle: Clear Restoration
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
        UILaunchStoryboardName: LaunchScreen
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppleMusicUsageDescription: PatataTube controls the system music player when the live page asks it to.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
    dependencies:
      - package: PatataTubeKit
      - package: Capture
        product: Capture
      - package: Sentry
        product: Sentry
      - package: Clocks
    settings:
      base:
        DEVELOPMENT_TEAM: Q3WS4MWCW3
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.patatatube.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "121"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
  PatataTubeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: PatataTube
      - package: Clocks
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patatube.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  PatataTube:
    build:
      targets:
        PatataTube: all
    run:
      config: Debug
      # The Simulator shares the host filesystem, so the app writes its dev log
      # straight to the repo — no server, no container spelunking. Absent on a
      # real device, where DevLog's HTTP sink posts to the backend instead.
      environmentVariables:
        PATATATUBE_DEV_LOG: /Users/grillermo/c/patatatube/log/ios.jsonl
    test:
      targets:
        - PatataTubeTests
    archive:
      config: Release
